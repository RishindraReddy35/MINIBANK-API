services:
  mysql:
    image: mysql:8.4
    container_name: minibank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: minibank
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpass
    ports:
      - "3306:3306"
    volumes:
      - minibank-data:/var/lib/mysql

volumes:
  minibank-data: